# ==========================================
# 🖥️ CONFIGURAÇÃO DE MONITORES
# ==========================================
monitor=HDMI-A-1, 1920x1080, 0x0, 1
monitor=eDP-1, 1366x768, 1920x0, 1

# ==========================================
# 🚀 VARIÁVEIS DE PROGRAMAS
# ==========================================
$mainMod = SUPER
$terminal = kitty
$browser = brave
$fileManager = thunar # <--- MUDADO AQUI: De cosmic-files para thunar
$overview = rofi -show window
$menu = pkill rofi || rofi -show drun

# ==========================================
# 🔧 AUTOSTART (INICIAR COM O SISTEMA)
# ==========================================
exec-once = LANG=pt_BR.UTF-8 LC_TIME=pt_BR.UTF-8 waybar
exec-once = swww-daemon
exec-once = hyprpaper
# Forçar o tema de fontes e interface a ficar menor (Padrão compacto do COSMIC)
exec-once = gsettings set org.gnome.desktop.interface text-scaling-factor 0.60
# ==========================================
# 🎨 ESTÉTICA E VISUAL
# ==========================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(ffffff10)
}

decoration {
    rounding = 5
    blur {
        enabled = true
        size = 3       # Reduzido de 5 para 3 (fica lindo e muito mais leve)
        passes = 1     # Reduzido de 2 para 1 para aliviar a GPU integrada Intel
        new_optimizations = true # Força o Hyprland a não renderizar o blur de janelas cobertas
    }
}

misc {
    vfr = true       # Variável de frames ativa: Se a tela não se mover, a GPU descansa (0 fps)
    vrr = 1          # Ativa o Adaptive Sync se o seu monitor suportar
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ==========================================
# ⌨️ INPUT (TECLADO E MOUSE)
# ==========================================
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 
}

# ==========================================
# ♿ ACESSIBILIDADE (ZOOM)
# ==========================================
bind = $mainMod, equal, exec, hyprctl keyword misc:cursor_zoom_factor 2.0
bind = $mainMod, period, exec, hyprctl keyword misc:cursor_zoom_factor 2.0
bind = $mainMod, minus, exec, hyprctl keyword misc:cursor_zoom_factor 1.0
bind = $mainMod, comma, exec, hyprctl keyword misc:cursor_zoom_factor 1.0

# ==========================================
# 🪟 GERENCIAMENTO DE JANELAS
# ==========================================
bind = ALT, F4, killactive, 
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F11, fullscreen, 0

# Redimensionar (Dentro/Fora)
binde = $mainMod SHIFT, R, resizeactive, -40 -40
binde = $mainMod, R, resizeactive, 40 40

# Mover janelas (Posição na grade)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, J, movewindow, d

windowrulev2 = float, class:(floating_term)
windowrulev2 = size 800 500, class:(floating_term)
windowrulev2 = center, class:(floating_term)

# --- REGRAS MAGICAS PARA A WAYBAR ESCONDER ATRAS DAS JANELAS ---
blurls = waybar
layerrule = blur, waybar
layerrule = ignorezero, waybar
# ==========================================
# 🧭 NAVEGAÇÃO E FOCO
# ==========================================
bind = $mainMod, left, movefocus, l
bind = $mainMod, H, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, L, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, K, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, J, movefocus, d

# Focar interna/externa (Sequencial)
bind = $mainMod, I, cyclenext,
bind = $mainMod, U, cyclenext, prev

# Alternar janelas (Tab)
bind = ALT, Tab, cyclenext,
bind = $mainMod, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, cyclenext, prev

# ==========================================
# 🏢 ÁREAS DE TRABALHO (WORKSPACES)
# ==========================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, previous

# Próxima/Anterior
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, L, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, H, workspace, e-1

# Navegar entre as áreas de trabalho usando SUPER + Setas Laterais
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1

# Mover janela para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ==========================================
# 📺 MONITORES
# ==========================================
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, H, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r
bind = $mainMod ALT, L, focusmonitor, r
bind = $mainMod ALT, up, focusmonitor, u
bind = $mainMod ALT, K, focusmonitor, u
bind = $mainMod ALT, down, focusmonitor, d
bind = $mainMod ALT, J, focusmonitor, d

# Mover janela entre monitores
bind = $mainMod ALT SHIFT, left, movewindow, mon:l
bind = $mainMod ALT SHIFT, H, movewindow, mon:l
bind = $mainMod ALT SHIFT, right, movewindow, mon:r
bind = $mainMod ALT SHIFT, L, movewindow, mon:r
bind = $mainMod ALT SHIFT, up, movewindow, mon:u
bind = $mainMod ALT SHIFT, K, movewindow, mon:u
bind = $mainMod ALT SHIFT, down, movewindow, mon:d
bind = $mainMod ALT SHIFT, J, movewindow, mon:d

# ==========================================
# 🛠️ SISTEMA, MÍDIA E ATALHOS GERAIS
# ==========================================
bind = $mainMod, A, exec, $menu
bind = $mainMod, slash, exec, $menu
bindr = $mainMod, SUPER_L, exec, $menu
bind = $mainMod, W, exec, $overview
bind = $mainMod, T, exec, $terminal
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, escape, exit
bind = $mainMod, escape, exec, swaylock
bind = $mainMod, space, exec, hyprctl switchxkblayout all next

# Atalho do Print Corrigido
bind = , Print, exec, grim -g "$(slurp)" ~/print.png

# Teclas de Brilho e Som
bindle = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindle = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindl  = , XF86AudioMicMute, exec, pamixer --default-source -t
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF85AudioPrev, exec, playerctl previous
